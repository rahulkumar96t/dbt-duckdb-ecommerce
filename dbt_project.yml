name: shop_analytics
version: "1.0.0"
config-version: 2
profile: shop_analytics
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data_tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

target-path: target
clean-targets: [target, logs]

flags:
  # keep runs offline and reproducible: no usage telemetry, no PyPI version check
  send_anonymous_usage_stats: false
  version_check: false

vars:
  # Customers with no order for this many days count as lapsed / churned.
  lapsed_after_days: 90
  churned_after_days: 180

models:
  shop_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

snapshots:
  shop_analytics:
    +schema: snapshots

data_tests:
  shop_analytics:
    +severity: error
