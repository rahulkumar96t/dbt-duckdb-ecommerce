[project]
name = "dbt-duckdb-ecommerce"
version = "0.1.0"
description = "Analytics-engineering reference project: seeded e-commerce data, dbt-core + DuckDB staging/intermediate/marts, SCD2 snapshot, tests and docs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "numpy>=2.4.6",
    "pyarrow>=26.0.0",
]

[project.scripts]
shop-data = "shop_data.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shop_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["dbt: runs the full dbt build against a temporary DuckDB file"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
